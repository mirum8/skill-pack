# Shipped defaults for the r skill pack.
#
# DO NOT EDIT THE INSTALLED COPY — ./install.sh rewrites this file on every run.
# To change settings for a project, create <project>/.config/skill-pack.yaml holding
# only the keys you want to override; anything left out falls back to this file, and
# anything this file leaves out falls back to the reader's built-in values.
#
# `model` and `effort` belong to the SELECTED provider: under `claude` they become the
# subagent's model and reasoning effort, under `codex` they become --model and --effort
# on the Codex CLI call. Switching provider therefore means reviewing all three.
#
# When `provider: codex` is set but the Codex plugin is not installed, the reader falls
# back to claude/opus/medium and names every substitution — a codex model string means
# nothing to a Claude subagent, and carrying `low` across would silently re-tier it.
#
# The `implement` and `fix` rows below sit on the SAME provider, which is what the one-writer
# rule in task-run-implement.workflow.js asks for: the model that wrote the change is the model
# that patches it. They are still costed apart — a fixer's brief is bounded (one named finding,
# one file, one line) where an implementer's is open-ended, so the fixer runs shallower. The
# constraint that matters is the direction: a fixer must never run DEEPER than the implementer
# whose code it patches. Every run records the resolved row for both, so
# `python3 lib/skill-stats.py` can bucket by provider once there are rows under it — and there
# are none yet on either side, so this whole pair is a measurement in progress, not a result.

steps:
  # The planning half of /r:task-run: the planner, the explorers that map the code for it, and the
  # judges that triage the Codex plan review. Planning costs MORE per run than the implementation
  # it feeds — judge 11.0M tokens, planner 10.3M, explore 7.5M, plan-fix 3.9M, ~39M in all against
  # implement's 33.1M — and ~97% of that is cache reads, i.e. context re-read, not output. So these
  # are the values to move when a run is too expensive, and `plan depth` in lib/skill-stats.py is
  # what says whether moving them cost anything.
  #
  # THE STANDING RULE: the judges must never run DEEPER than the planner whose plan they check. A
  # judge answers one narrow question with the explorer briefs already in hand; depth spent there is
  # depth taken from the artifact everything downstream is built on. Nothing enforces it — a silent
  # clamp would override a value you can see right here — so it is on you when you edit them.
  #
  # No `provider` here, unlike the two rows below: the planner returns markdown the pipeline copies
  # to disk verbatim, and the explorers and judges return schema'd objects it branches on. None of
  # that survives a hand-off to a CLI, so codex is not an option for this row.
  plan:
    model: fable          # the planner — fable | opus | sonnet | haiku
    effort: medium        # low | medium | high | xhigh | max

    # The explorers that map the code before the plan is written. Cheaper than the planner by
    # design — read-and-map work, not judgement. `medium` rather than `low` because the one
    # consequential call an explorer makes is riskFlags, which escalates a light task to full the
    # moment it sees auth, money, migrations or concurrency.
    exploreModel: sonnet
    exploreEffort: medium

    # The judges that triage the Codex plan review. Most plan findings never reach one: a finding
    # from a rubric whose precision is ~91% (grounding, test-adequacy, ui-design) and that names a
    # file:LINE goes to a haiku citation check instead, and only coverage, risk, simplicity and
    # findings with no usable citation are judged here.
    #
    # `sonnet` is an experiment under measurement, not a settled tier. The baseline it is read
    # against is opus/high: 462 judge dispatches in the store, 607M tokens, holding the judge lane
    # at 83% (coverage), 90% (risk) and 75% (simplicity) precision. Read `plan depth` and the
    # per-lane split in lib/skill-stats.py afterwards; put it back to opus if those fall.
    judgeModel: sonnet
    judgeEffort: high

  implement:
    provider: codex       # claude | codex
    model: gpt5.6-sol     # codex: passed through to the CLI; claude: fable|opus|sonnet|haiku
    effort: medium        # low | medium | high | xhigh | max

    # IMPL_RUN in task-run-implement.workflow.js is what a run uses when it cannot reach this file
    # at all, and it is claude/opus/medium — a CLAUDE-SHAPED fallback by construction, because the
    # fallback path has no provider to set. So a codex row here cannot be mirrored into it, and the
    # two deliberately disagree. What keeps that honest is the log: a run that could not read this
    # file says so by name ("the config could not be read — implementers fall back to …"), so the
    # divergence is visible in the run rather than inferred from a tier.
    #
    # `medium` is the depth handed to the Codex CLI as --effort. UNDER MEASUREMENT on both axes:
    # `implement depth` in lib/skill-stats.py has 42 runs at `high` (2.04 correctness and 3.36
    # readability fixes per paired review) against 4 at `medium`, and NO codex implementer run at
    # all — and that table cannot compare providers anyway, since the effort it mines off the items
    # is the wrapper's rather than the writer's. implProvider/implModel/implEffort in the run
    # payload is what will answer it. Read both halves when it does: a cheaper implementer that
    # pushes work into fix-correctness and end-verify-fix has moved cost, not saved it.

    # LIVE under this row — the Claude subagent that DRIVES the CLI, not the writer. It passes the
    # brief through, collects a run that outlives the ~600s Bash cap, then reads the working tree to
    # report filesChanged, testEvidence and blockedOn.
    #
    # `haiku` is AN EXPERIMENT UNDER MEASUREMENT here, not a settled value, and it is the direction
    # this row was warned against: a wrapper that gives up on the collect halts the run over work
    # Codex actually finished, and that is invisible to every reviewer downstream. Two things make
    # it worth trying anyway. The wait is now ONE blocking shell loop rather than a poll per turn,
    # so whether a live PID "looks stuck" is no longer a judgement the model makes — which was the
    # actual failure, not depth. And the evidence this agent reports is the working tree, not its
    # own reading: `git status --porcelain` and `git diff` decide filesChanged, so a shallower
    # model has less room to be wrong about what landed.
    #
    # `wrapperEffort` does NOT follow it down. The collect needs no depth, but the tree read at the
    # end is a real one. If this experiment fails it will look like blocked slices over a working
    # tree that already holds the change — put it back to sonnet and say so here.
    wrapperModel: haiku   # fable | opus | sonnet | haiku
    wrapperEffort: medium # low | medium | high | xhigh | max

  # The three fixers in /r:task-review: fix-correctness, end-verify-fix, ui-fix-minor. Not the
  # readability refactor, which invokes the /r:code-refactor skill and has nothing to hand a CLI.
  #
  # The pack's second-largest write-side block after the implementers themselves — ui-fix-minor
  # 595M tokens over 64 runs, fix-correctness 493M over 53, end-verify-fix 238M over 42 — and the
  # cheaper half of the codex pair the header describes, since a fixer's brief is one finding.
  #
  # A fixer must never run DEEPER than the implementer whose code it patches: the hard thinking
  # (is this finding real, what should change) already happened in triage. Nothing enforces that
  # across these two rows — task-review does not read the implement row, and a silent clamp would
  # override a value you can see right here. It is on you when you edit them.
  fix:
    provider: codex       # claude | codex
    model: gpt5.6-sol     # codex: passed through to the CLI; claude: fable|opus|sonnet|haiku
    effort: low           # low | medium | high | xhigh | max

    # Under `provider: codex` only: the Claude subagent that DRIVES the CLI — it passes the finding
    # through, collects a run that outlives the ~600s Bash cap, then reads the working tree to
    # report what landed. Not the writer.
    #
    # `haiku` for the same reason as the implement row above, and it is the same experiment: the
    # collect is now one blocking shell loop rather than a poll per turn, and what this agent
    # reports comes from `git diff` rather than from its own reading of Codex's summary. The
    # failure to watch for is a fix Codex applied being reported as unfixed. `wrapperEffort` stays
    # at medium — beyond the edits, the rebuild/redeploy/re-verify loop is this agent's own work.
    wrapperModel: haiku   # fable | opus | sonnet | haiku
    wrapperEffort: medium # low | medium | high | xhigh | max

  # How many units /r:plan-run and /r:issues-fix keep live at once under --cmux. One setting, not
  # one per skill: both drive the same fan-out script. Three full implement+review pipelines is
  # already the machine's limit — implement alone measures 20.9M tokens and ~1022s per agent — so
  # a wider wave thrashes rather than finishing sooner. Raise it as a measurement, not a guess.
  fanout:
    maxUnits: 3           # 1..16
